<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1000px" height="1000px" viewBox="0 0 1000 1000">
  <title>01 2 × 2 Grid — Square and Modular</title>
  <g id="background">
    <rect x="0" y="0" width="1000" height="1000" fill="#ffffff" stroke="none"/>
  </g>
  <g id="construction-guides">
    <g id="g01-2-x-2-grid-guides">
      <line x1="500" y1="50" x2="500" y2="950" fill="none" stroke="#9a9a9a" stroke-width="1"/>
      <line x1="50" y1="500" x2="950" y2="500" fill="none" stroke="#9a9a9a" stroke-width="1"/>
    </g>
  </g>
  <g id="key-lines">
    <g id="g01-2-x-2-grid-key">
      <polygon points="50,50 950,50 950,950 50,950" fill="none" stroke="#000000" stroke-width="1.5"/>
    </g>
  </g>
  <g id="logo-artwork">
  </g>
</svg>
